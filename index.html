<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0c0a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="A small index of projects, tools, and other things Girt hosts.">
  <meta property="og:title" content="GirtHub">
  <meta property="og:description" content="A small index of projects, tools, and other things Girt hosts.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://girt26.github.io/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23a63f1c'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='bold' text-anchor='middle' fill='%23f3efe6'%3EG%3C/text%3E%3C/svg%3E">
  <title>GirtHub</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3efe6;
      --ink: #171512;
      --muted: #6f685d;
      --line: #d6cfc1;
      --line-strong: #b8ae9d;
      --accent: #a63f1c;
      --hover: rgba(166, 63, 28, .06);
      --selection: rgba(166, 63, 28, .18);
      --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif", serif;
      --sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0c0a;
        --ink: #ece5da;
        --muted: #a39a8d;
        --line: #2c2722;
        --line-strong: #453e35;
        --accent: #e08a5f;
        --hover: rgba(224, 138, 95, .07);
        --selection: rgba(224, 138, 95, .25);
      }
    }

    * { box-sizing: border-box; }

    html {
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
      font-optical-sizing: auto;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    ::selection {
      color: var(--ink);
      background: var(--selection);
    }

    a { color: inherit; }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .page {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 1040px;
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(28px, 5vw, 56px) clamp(20px, 5vw, 48px) 28px;
    }

    /* ---------- Masthead ---------- */
    .masthead {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      font-family: var(--serif);
      font-size: 1.22rem;
      font-weight: 600;
      letter-spacing: -.015em;
      text-decoration: none;
    }

    .wordmark span { color: var(--muted); }

    .masthead-meta {
      margin: 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .7rem;
      letter-spacing: .01em;
    }

    /* ---------- Main layout ---------- */
    .layout {
      display: grid;
      flex: 1;
      grid-template-columns: minmax(220px, .8fr) minmax(0, 1.2fr);
      gap: clamp(44px, 8vw, 110px);
      align-items: start;
      padding-top: clamp(44px, 8vh, 88px);
    }

    .intro h1 {
      max-width: 9ch;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(2.5rem, 4.6vw, 3.6rem);
      font-weight: 600;
      line-height: 1.02;
      letter-spacing: -.03em;
      text-wrap: balance;
    }

    .lede {
      max-width: 30ch;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
      text-wrap: pretty;
    }

    .updated {
      margin: 34px 0 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .7rem;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Index ---------- */
    .index-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line-strong);
    }

    .index-head h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -.01em;
    }

    .index-count {
      color: var(--muted);
      font-family: var(--mono);
      font-size: .7rem;
      font-variant-numeric: tabular-nums;
    }

    .link-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .link-item { border-bottom: 1px solid var(--line); }

    .link-row {
      display: grid;
      grid-template-columns: 2.25rem minmax(0, 1fr) auto 1.1rem;
      align-items: baseline;
      gap: 0 14px;
      margin: 0 -14px;
      padding: 20px 14px;
      color: var(--ink);
      text-decoration: none;
      transition: background-color .15s ease;
    }

    .row-number {
      color: var(--muted);
      font-family: var(--mono);
      font-size: .7rem;
      font-variant-numeric: tabular-nums;
    }

    .row-body { min-width: 0; }

    .row-title {
      display: block;
      font-family: var(--serif);
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -.015em;
      transition: color .15s ease;
    }

    .row-note {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: .84rem;
      line-height: 1.4;
    }

    .row-url {
      max-width: 30ch;
      overflow: hidden;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .68rem;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .row-arrow {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1;
      transition: color .15s ease, transform .15s ease;
    }

    .link-row:active { background: var(--hover); }

    .link-row:focus-visible .row-arrow {
      color: var(--accent);
      transform: none;
      opacity: 1;
    }

    @media (hover: hover) {
      .link-row:hover { background: var(--hover); }

      .link-row:hover .row-title,
      .link-row:hover .row-arrow { color: var(--accent); }

      .link-row .row-arrow {
        opacity: 0;
        transform: translate(-4px, 4px);
      }

      .link-row:hover .row-arrow {
        opacity: 1;
        transform: none;
      }
    }

    /* ---------- Footer ---------- */
    .footer {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-top: clamp(56px, 10vh, 110px);
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: var(--mono);
      font-size: .68rem;
      font-variant-numeric: tabular-nums;
    }

    .footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color .15s ease;
    }

    .footer a:hover { color: var(--accent); }

    /* ---------- Responsive ---------- */
    @media (max-width: 720px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 48px;
      }

      .intro h1 {
        max-width: none;
        font-size: clamp(2.4rem, 9vw, 3.2rem);
      }

      .lede { max-width: 34ch; }

      .updated { margin-top: 22px; }

      .link-row {
        grid-template-columns: 1.9rem minmax(0, 1fr) 1.1rem;
        gap: 0 12px;
      }

      .row-url { display: none; }

      .row-title { font-size: 1.25rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- ============================================================
       LINKS CONFIG — edit the rows below to change the index.
       Each row is one entry:
         title   project name
         note    optional one-line description
         url     where the entry goes
       Add a row by copying the line after the list.
       ============================================================ -->
  <script>
    const LINKS = [
      { title: "Thiscord", note: "Discord client", url: "https://girt26.github.io/thiscord" },
      { title: "Eaglercraft 26.2", note: "Minecraft in the browser", url: "https://girt26.github.io/zeuscraft" },

      // Copy this line to add another entry:
      // { title: "New link", note: "Short description", url: "https://example.com" },
    ];
  </script>

  <main class="page">
    <header class="masthead">
      <a class="wordmark" href="/">Girt<span>Hub</span></a>
      <p class="masthead-meta">Personal index</p>
    </header>

    <div class="layout">
      <aside class="intro">
        <h1>Things<br>I host.</h1>
        <p class="lede">Projects, tools, and other things I keep online.</p>
        <p class="updated">Updated November 2026</p>
      </aside>

      <section class="index" aria-labelledby="index-title">
        <div class="index-head">
          <h2 id="index-title">Index</h2>
          <span class="index-count" id="index-count">00 entries</span>
        </div>
        <ol class="link-list" id="link-list"></ol>
      </section>
    </div>

    <footer class="footer">
      <span>© <span id="year"></span> Girt</span>
      <a href="https://girt26.github.io/">girt26.github.io</a>
    </footer>
  </main>

  <script>
    function prettyUrl(value) {
      try {
        const parsed = new URL(value);
        const path = parsed.pathname.replace(/\/$/, '');
        return parsed.host + path;
      } catch (error) {
        return value;
      }
    }

    const list = document.getElementById('link-list');

    const rows = LINKS.map(function (item, index) {
      const entry = document.createElement('li');
      entry.className = 'link-item';

      const link = document.createElement('a');
      link.className = 'link-row';
      link.href = item.url;

      const number = document.createElement('span');
      number.className = 'row-number';
      number.textContent = String(index + 1).padStart(2, '0');
      number.setAttribute('aria-hidden', 'true');

      const body = document.createElement('span');
      body.className = 'row-body';

      const title = document.createElement('span');
      title.className = 'row-title';
      title.textContent = item.title;
      body.append(title);

      if (item.note) {
        const note = document.createElement('span');
        note.className = 'row-note';
        note.textContent = item.note;
        body.append(note);
      }

      const url = document.createElement('span');
      url.className = 'row-url';
      url.textContent = prettyUrl(item.url);
      url.title = item.url;

      const arrow = document.createElement('span');
      arrow.className = 'row-arrow';
      arrow.textContent = '↗';
      arrow.setAttribute('aria-hidden', 'true');

      link.append(number, body, url, arrow);
      entry.append(link);
      return entry;
    });

    list.replaceChildren.apply(list, rows);
    document.getElementById('index-count').textContent =
      String(LINKS.length).padStart(2, '0') + (LINKS.length === 1 ? ' entry' : ' entries');
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
