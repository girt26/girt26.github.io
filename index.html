<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0c0a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="A small index of projects, tools, and other things Girt hosts.">
  <meta property="og:title" content="GirtHub">
  <meta property="og:description" content="A small index of projects, tools, and other things Girt hosts.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://girt26.github.io/">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://girt26.github.io/">
  <script>
    // Apply a saved theme before first paint to avoid a flash.
    document.documentElement.classList.add('js');
    try {
      const saved = localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.dataset.theme = saved;
      }
    } catch (error) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23a63f1c'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='bold' text-anchor='middle' fill='%23f3efe6'%3EG%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>GirtHub</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3efe6;
      --ink: #171512;
      --muted: #6f685d;
      --line: #d6cfc1;
      --line-strong: #b8ae9d;
      --accent: #a63f1c;
      --hover: rgba(166, 63, 28, .06);
      --selection: rgba(166, 63, 28, .18);
      --serif: "Newsreader", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif", serif;
      --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0e0c0a;
        --ink: #ece5da;
        --muted: #a39a8d;
        --line: #2c2722;
        --line-strong: #453e35;
        --accent: #e08a5f;
        --hover: rgba(224, 138, 95, .07);
        --selection: rgba(224, 138, 95, .25);
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0e0c0a;
      --ink: #ece5da;
      --muted: #a39a8d;
      --line: #2c2722;
      --line-strong: #453e35;
      --accent: #e08a5f;
      --hover: rgba(224, 138, 95, .07);
      --selection: rgba(224, 138, 95, .25);
    }

    :root[data-theme="light"] { color-scheme: light; }

    * { box-sizing: border-box; }

    html {
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      /* Tactile background texture overlay */
      background-image: radial-gradient(var(--line) 0.75px, transparent 0.75px);
      background-size: 16px 16px;
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
      font-optical-sizing: auto;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    ::selection {
      color: var(--ink);
      background: var(--selection);
    }

    a { color: inherit; }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 2px;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 980px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: clamp(28px, 5vw, 56px) clamp(20px, 5vw, 48px) 28px;
      animation: fadeInUp 0.6s ease-out forwards;
    }

    /* ---------- Masthead ---------- */
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .wordmark {
      font-family: var(--serif);
      font-size: 1.22rem;
      font-weight: 600;
      letter-spacing: -.015em;
      text-decoration: none;
    }

    .wordmark-name span { color: var(--muted); }

    .masthead-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .masthead-meta {
      margin: 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .75rem;
      letter-spacing: .01em;
    }

    .theme-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      cursor: pointer;
      transition: color .15s ease, border-color .15s ease, background-color .15s ease;
    }

    .js .theme-toggle { display: inline-flex; }

    .theme-toggle svg {
      width: 1rem;
      height: 1rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .theme-toggle .icon-sun { display: block; }
      :root:not([data-theme="light"]) .theme-toggle .icon-moon { display: none; }
    }

    :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    :root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

    @media (hover: hover) {
      .theme-toggle:hover {
        color: var(--accent);
        border-color: var(--accent);
        background: var(--hover);
      }
    }

    .theme-toggle:active { background: var(--hover); }

    /* ---------- Main layout ---------- */
    .layout {
      display: grid;
      flex: 1;
      grid-template-columns: minmax(200px, .7fr) minmax(0, 1.5fr);
      gap: clamp(32px, 5vw, 72px);
      align-items: start;
      padding-top: clamp(44px, 8vh, 88px);
    }

    .intro h1 {
      max-width: 9ch;
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(2.5rem, 4.6vw, 3.6rem);
      font-weight: 600;
      line-height: 1.02;
      letter-spacing: -.03em;
      text-wrap: balance;
    }

    .lede {
      max-width: 30ch;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
      text-wrap: pretty;
    }

    /* ---------- Index ---------- */
    .index-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line-strong);
    }

    .index-head h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -.01em;
    }

    .index-count {
      color: var(--muted);
      font-family: var(--mono);
      font-size: .75rem;
      font-variant-numeric: tabular-nums;
    }

    .link-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .link-item { border-bottom: 1px solid var(--line); }

    .link-row {
      display: grid;
      grid-template-columns: 2.25rem minmax(0, 1fr) auto 1.1rem;
      align-items: baseline;
      gap: 0 14px;
      margin: 0 -14px;
      padding: 20px 14px;
      color: var(--ink);
      text-decoration: none;
      transition: background-color .15s ease;
    }

    .row-number {
      color: var(--muted);
      font-family: var(--mono);
      font-size: .75rem;
      font-variant-numeric: tabular-nums;
    }

    .row-body { min-width: 0; }

    .row-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .row-icon {
      width: 1.15rem;
      height: 1.15rem;
      fill: currentColor;
      color: var(--muted);
      flex-shrink: 0;
      transition: color .15s ease;
    }

    .row-title {
      font-family: var(--serif);
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -.015em;
      transition: color .15s ease;
    }

    .row-tag {
      font-family: var(--mono);
      font-size: .75rem;
      color: var(--muted);
      border: 1px solid var(--line-strong);
      padding: 1px 5px;
      border-radius: 3px;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    .row-note {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: .84rem;
      line-height: 1.4;
    }

    .row-url {
      max-width: 30ch;
      overflow: hidden;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .75rem;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .row-arrow {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1;
      transition: color .15s ease, transform .15s ease;
    }

    .link-row:active { background: var(--hover); }

    .link-row:focus-visible .row-arrow {
      color: var(--accent);
      transform: none;
      opacity: 1;
    }

    @media (hover: hover) {
      .link-row:hover { background: var(--hover); }

      .link-row:hover .row-title,
      .link-row:hover .row-arrow,
      .link-row:hover .row-icon { color: var(--accent); }

      .link-row .row-arrow {
        opacity: 0;
        transform: translate(-4px, 4px);
      }

      .link-row:hover .row-arrow {
        opacity: 1;
        transform: none;
      }
    }

    /* ---------- Footer ---------- */
    .footer {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-top: clamp(56px, 10vh, 110px);
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: var(--mono);
      font-size: .75rem;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 860px) {
      .link-row {
        grid-template-columns: 1.9rem minmax(0, 1fr) 1.1rem;
        gap: 0 12px;
      }

      .row-url { display: none; }
    }

    @media (max-width: 720px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 48px;
      }

      .intro h1 {
        max-width: none;
        font-size: clamp(2.4rem, 9vw, 3.2rem);
      }

      .lede { max-width: 34ch; }

      .row-title { font-size: 1.25rem; }
    }

    @media (max-width: 420px) {
      .masthead-meta { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .page { animation: none; }
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    /* ---------- Art direction ---------- */
    :root {
      --surface: rgba(255, 253, 248, .72);
      --surface-raised: rgba(255, 253, 248, .92);
      --ambient: rgba(223, 130, 88, .16);
      --ambient-cool: rgba(113, 130, 171, .09);
      --card-shadow: 0 18px 48px rgba(67, 45, 28, .055);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --surface: rgba(255, 255, 255, .025);
        --surface-raised: rgba(255, 255, 255, .055);
        --ambient: rgba(211, 105, 65, .12);
        --ambient-cool: rgba(93, 111, 157, .13);
        --card-shadow: 0 18px 48px rgba(0, 0, 0, .18);
      }
    }

    :root[data-theme="dark"] {
      --surface: rgba(255, 255, 255, .025);
      --surface-raised: rgba(255, 255, 255, .055);
      --ambient: rgba(211, 105, 65, .12);
      --ambient-cool: rgba(93, 111, 157, .13);
      --card-shadow: 0 18px 48px rgba(0, 0, 0, .18);
    }

    body {
      position: relative;
      background-image:
        radial-gradient(ellipse at 78% 8%, var(--ambient), transparent 34rem),
        radial-gradient(ellipse at 8% 68%, var(--ambient-cool), transparent 32rem),
        radial-gradient(var(--line) .65px, transparent .65px);
      background-size: auto, auto, 18px 18px;
      background-attachment: fixed;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      padding-top: clamp(24px, 4vw, 42px);
    }

    body::before {
      position: fixed;
      z-index: 0;
      inset: -35%;
      background:
        radial-gradient(ellipse at 18% 28%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 28%),
        radial-gradient(ellipse at 76% 34%, var(--ambient-cool), transparent 26%),
        radial-gradient(ellipse at 62% 82%, var(--ambient), transparent 24%);
      content: "";
      pointer-events: none;
      animation: atmosphereDrift 28s ease-in-out infinite alternate;
      will-change: transform;
    }

    .masthead {
      padding-bottom: 17px;
      border-color: color-mix(in srgb, var(--line-strong) 70%, transparent);
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 1.3rem;
    }

    .wordmark-mark {
      display: grid;
      width: 1.8rem;
      height: 1.8rem;
      flex: 0 0 auto;
      place-items: center;
      color: var(--bg);
      background: var(--accent);
      border-radius: 7px;
      font-family: var(--serif);
      font-size: 1.12rem;
      font-weight: 600;
      line-height: 1;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 25%, transparent);
      animation: logoBreathe 4s ease-in-out infinite;
      transition: transform .3s cubic-bezier(.2, .8, .2, 1), box-shadow .3s ease;
    }

    .wordmark-name { white-space: nowrap; }

    .wordmark:hover .wordmark-mark {
      transform: rotate(-12deg) scale(1.12);
      box-shadow: 0 7px 22px color-mix(in srgb, var(--accent) 38%, transparent);
    }

    .masthead-meta {
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .theme-toggle {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 8px;
      transition: color .2s ease, border-color .2s ease, background-color .2s ease, transform .35s cubic-bezier(.2, .8, .2, 1);
    }

    .theme-toggle svg {
      transition: transform .45s cubic-bezier(.2, .8, .2, 1);
    }

    .theme-toggle:hover {
      transform: rotate(-8deg) scale(1.08);
    }

    .theme-toggle:hover svg {
      transform: rotate(35deg);
    }

    .layout {
      grid-template-columns: minmax(250px, .82fr) minmax(0, 1.18fr);
      gap: clamp(36px, 7vw, 92px);
      padding-top: clamp(52px, 10vh, 108px);
    }

    .intro {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: clamp(25px, 4vw, 38px);
      border: 1px solid color-mix(in srgb, var(--line-strong) 58%, transparent);
      border-radius: 18px;
      background:
        radial-gradient(circle at 100% 0%, var(--ambient), transparent 52%),
        linear-gradient(145deg, var(--surface-raised), var(--surface));
      box-shadow: var(--card-shadow);
      animation: heroArrive .9s cubic-bezier(.16, 1, .3, 1) .04s both;
      transition: box-shadow .35s ease, border-color .35s ease, transform .35s cubic-bezier(.2, .8, .2, 1);
    }

    .intro:hover {
      border-color: color-mix(in srgb, var(--accent) 38%, var(--line));
      box-shadow: 0 24px 64px color-mix(in srgb, var(--accent) 11%, transparent), var(--card-shadow);
      transform: translateY(-3px);
    }

    .intro::before {
      position: absolute;
      z-index: -1;
      top: 17%;
      right: 12%;
      width: 14px;
      aspect-ratio: 1;
      border: 1px solid color-mix(in srgb, var(--accent) 48%, transparent);
      border-radius: 50%;
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 40%, transparent);
      content: "";
      animation: moteFloat 7s ease-in-out infinite;
      pointer-events: none;
    }

    .intro::after {
      position: absolute;
      z-index: -1;
      right: -32px;
      bottom: -96px;
      width: 220px;
      aspect-ratio: 1;
      border: 1px solid color-mix(in srgb, var(--accent) 17%, transparent);
      border-radius: 50%;
      box-shadow:
        0 0 0 18px color-mix(in srgb, var(--accent) 4%, transparent),
        0 0 0 38px color-mix(in srgb, var(--accent) 3%, transparent);
      content: "";
      pointer-events: none;
      transform-origin: 50% 50%;
      animation: ringDrift 36s linear infinite;
    }

    .intro-kicker {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 30px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .intro h1 {
      max-width: none;
      font-size: clamp(3.35rem, 7.3vw, 5.7rem);
      line-height: .91;
      letter-spacing: -.065em;
    }

    .title-accent {
      color: var(--accent);
      font-style: italic;
      font-weight: 400;
      letter-spacing: -.075em;
      background-image: linear-gradient(105deg, var(--accent) 18%, color-mix(in srgb, var(--accent) 48%, var(--ink)) 42%, var(--accent) 66%);
      background-size: 220% 100%;
      background-position: 100% 0;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleShimmer 7s ease-in-out 1.1s infinite;
    }

    .lede {
      max-width: 24ch;
      margin-top: 24px;
      font-size: 1.02rem;
    }

    .index {
      padding-top: 5px;
      animation: indexArrive .85s cubic-bezier(.16, 1, .3, 1) .14s both;
    }

    .index-head {
      margin-bottom: 14px;
      padding-bottom: 13px;
    }

    .index-head h2 {
      font-size: 1.25rem;
    }

    .index-count {
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 99px;
      background: var(--surface);
      letter-spacing: .04em;
    }

    .link-list {
      display: grid;
      gap: 12px;
    }

    .link-item {
      border: 0;
      animation: cardArrive .7s cubic-bezier(.16, 1, .3, 1) both;
    }

    .link-item:nth-child(1) { animation-delay: .25s; }
    .link-item:nth-child(2) { animation-delay: .38s; }
    .link-item:nth-child(3) { animation-delay: .51s; }
    .link-item:nth-child(4) { animation-delay: .64s; }
    .link-item:nth-child(n + 5) { animation-delay: .76s; }

    .link-row > * {
      position: relative;
      z-index: 1;
    }

    .link-row {
      position: relative;
      overflow: hidden;
      grid-template-columns: 2.25rem minmax(0, 1fr) auto 1.1rem;
      gap: 0 14px;
      margin: 0;
      padding: 20px 18px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      box-shadow: 0 4px 16px rgba(67, 45, 28, .025);
      transition:
        border-color .2s ease,
        background-color .2s ease,
        box-shadow .2s ease,
        transform .32s cubic-bezier(.2, .8, .2, 1);
    }

    .link-row::after {
      position: absolute;
      z-index: 0;
      inset: -60% auto -60% -85%;
      width: 42%;
      background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 9%, transparent), transparent);
      content: "";
      pointer-events: none;
      transform: skewX(-20deg);
      transition: left .65s cubic-bezier(.2, .8, .2, 1);
    }

    .link-row::before {
      position: absolute;
      z-index: 2;
      inset: 14px auto 14px 0;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--accent);
      content: "";
      opacity: 0;
      transform: scaleY(.5);
      transition: opacity .2s ease, transform .2s ease;
    }

    .row-number {
      align-self: start;
      padding-top: 4px;
      letter-spacing: .04em;
    }

    .row-icon {
      width: 1.05rem;
      height: 1.05rem;
      cursor: default;
    }

    .row-title {
      font-size: 1.42rem;
    }

    .row-tag {
      padding: 2px 7px;
      border-color: color-mix(in srgb, var(--accent) 32%, var(--line));
      border-radius: 99px;
      color: var(--accent);
      font-size: .65rem;
      letter-spacing: .08em;
    }

    .row-note {
      margin-top: 5px;
    }

    .row-url {
      font-size: .68rem;
    }

    .row-arrow {
      display: grid;
      width: 1.65rem;
      height: 1.65rem;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      font-size: .9rem;
      transition:
        color .2s ease,
        border-color .2s ease,
        background-color .2s ease,
        transform .2s ease;
    }

    .link-row:focus-visible {
      border-color: var(--accent);
      background: var(--surface-raised);
    }

    .link-row:focus-visible::before {
      opacity: 1;
      transform: scaleY(1);
    }

    .link-row:focus-visible .row-arrow {
      color: var(--bg);
      border-color: var(--accent);
      background: var(--accent);
    }

    @media (hover: hover) {
      .link-row:hover {
        border-color: color-mix(in srgb, var(--accent) 50%, var(--line));
        background: var(--surface-raised);
        box-shadow: var(--card-shadow);
        transform: translateY(-5px) scale(1.012);
      }

      .link-row:hover::after {
        left: 145%;
      }

      .link-row:hover::before {
        opacity: 1;
        transform: scaleY(1);
      }

      .link-row:hover .row-arrow {
        color: var(--bg);
        border-color: var(--accent);
        background: var(--accent);
        transform: rotate(45deg);
      }

      .link-row .row-arrow {
        opacity: 1;
      }
    }

    .footer {
      position: relative;
      margin-top: clamp(52px, 9vh, 96px);
      padding-top: 17px;
    }

    .footer::before {
      position: absolute;
      top: -1px;
      left: 0;
      width: 28%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      content: "";
      animation: footerGleam 8s ease-in-out 2s infinite;
    }

    @keyframes atmosphereDrift {
      0% { transform: translate3d(-2%, -1%, 0) rotate(-5deg) scale(1); }
      100% { transform: translate3d(2%, 2%, 0) rotate(5deg) scale(1.08); }
    }

    @keyframes logoBreathe {
      0%, 100% { box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 22%, transparent); }
      50% { box-shadow: 0 5px 22px color-mix(in srgb, var(--accent) 42%, transparent); }
    }

    @keyframes heroArrive {
      from { opacity: 0; transform: translateY(28px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes indexArrive {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardArrive {
      from { opacity: 0; transform: translateY(20px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes moteFloat {
      0%, 100% { transform: translate3d(0, 0, 0) scale(.85); }
      50% { transform: translate3d(-18px, 20px, 0) scale(1.2); }
    }

    @keyframes ringDrift {
      to { transform: rotate(360deg); }
    }

    @keyframes titleShimmer {
      0%, 18% { background-position: 100% 0; }
      48%, 100% { background-position: -120% 0; }
    }

    @keyframes footerGleam {
      0%, 100% { transform: translateX(0); opacity: .25; }
      50% { transform: translateX(260%); opacity: .9; }
    }

    @media (max-width: 860px) {
      .link-row {
        grid-template-columns: 1.9rem minmax(0, 1fr) 1.1rem;
        gap: 0 12px;
      }
    }

    @media (max-width: 720px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 34px;
        padding-top: 44px;
      }

      .intro {
        padding: 27px;
      }

      .intro-kicker {
        margin-bottom: 24px;
      }

      .intro h1 {
        font-size: clamp(3.6rem, 15vw, 5.7rem);
      }

      .lede {
        margin-top: 18px;
      }

      .index {
        padding-top: 0;
      }

      .row-title {
        font-size: 1.3rem;
      }
    }

    @media (max-width: 420px) {
      .page {
        padding-right: 17px;
        padding-left: 17px;
      }

      .masthead-meta { display: none; }

      .link-row {
        grid-template-columns: 1.55rem minmax(0, 1fr) 1.1rem;
        gap: 0 9px;
        padding: 17px 13px;
      }

      .row-title-wrap { gap: 6px; }

      .row-tag { font-size: .58rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }

      .page,
      .intro,
      .index,
      .link-item {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <a class="wordmark" href="/">
        <span class="wordmark-mark" aria-hidden="true">G</span>
        <span class="wordmark-name">Girt<span>Hub</span></span>
      </a>
      <div class="masthead-right">
        <p class="masthead-meta">Personal index</p>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <aside class="intro">
        <p class="intro-kicker">A small corner of the web</p>
        <h1>Random<br><span class="title-accent">Stuff.</span></h1>
        <p class="lede">Stuff you might use.</p>
      </aside>

      <section class="index" aria-labelledby="index-title">
        <div class="index-head">
          <h2 id="index-title">Index</h2>
          <span class="index-count" id="index-count">02 entries</span>
        </div>
        <ol class="link-list" id="link-list" role="list">
          <li class="link-item">
            <a class="link-row" href="https://girt26.github.io/thiscord">
              <span class="row-number" aria-hidden="true">01</span>
              <span class="row-body">
                <span class="row-title-wrap">
                  <svg class="row-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                  <span class="row-title">Thiscord</span>
                </span>
                <span class="row-note">Thiscord client</span>
              </span>
              <span class="row-url" aria-hidden="true">girt26.github.io/thiscord</span>
              <span class="row-arrow" aria-hidden="true">↗</span>
            </a>
          </li>
          <li class="link-item">
            <a class="link-row" href="https://girt26.github.io/zeuscraft">
              <span class="row-number" aria-hidden="true">02</span>
              <span class="row-body">
                <span class="row-title-wrap">
                  <svg class="row-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.3l6.7 3.35L12 11 5.3 7.65 12 4.3zM4 9.15l7 3.5v7l-7-3.5v-7zm16 7l-7 3.5v-7l7-3.5v7z"/></svg>
                  <span class="row-title">Eaglercraft 26.2</span>
                </span>
                <span class="row-note">Minecraft 26.2</span>
              </span>
              <span class="row-url" aria-hidden="true">girt26.github.io/zeuscraft</span>
              <span class="row-arrow" aria-hidden="true">↗</span>
            </a>
          </li>
        </ol>
      </section>
    </div>

    <footer class="footer">
      <span>© <span id="year"></span> Girt</span>
    </footer>
  </main>

  <script>
    const list = document.getElementById('link-list');
    const count = list ? list.children.length : 0;
    const countLabel = document.getElementById('index-count');

    if (countLabel) {
      countLabel.textContent = String(count).padStart(2, '0') + (count === 1 ? ' entry' : ' entries');
    }

    document.querySelectorAll('.row-icon').forEach(function (icon) {
      icon.addEventListener('click', function (event) {
        event.preventDefault();
      });
    });

    const year = document.getElementById('year');
    if (year) year.textContent = new Date().getFullYear();

    // Theme toggle: system preference by default, with a saved manual override.
    const root = document.documentElement;
    const toggle = document.getElementById('theme-toggle');
    const media = window.matchMedia('(prefers-color-scheme: dark)');

    function activeTheme() {
      if (root.dataset.theme === 'light' || root.dataset.theme === 'dark') {
        return root.dataset.theme;
      }
      return media.matches ? 'dark' : 'light';
    }

    function syncToggle() {
      const next = activeTheme() === 'dark' ? 'light' : 'dark';
      toggle.setAttribute('aria-label', 'Switch to ' + next + ' theme');
    }

    function syncThemeColor() {
      const color = activeTheme() === 'dark' ? '#0e0c0a' : '#f3efe6';
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
        meta.setAttribute('media', 'all');
        meta.setAttribute('content', color);
      });
    }

    if (toggle) {
      syncToggle();
      if (root.dataset.theme) syncThemeColor();

      toggle.addEventListener('click', function () {
        const next = activeTheme() === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        try {
          localStorage.setItem('theme', next);
        } catch (error) {}
        syncToggle();
        syncThemeColor();
      });

      media.addEventListener('change', function () {
        if (!root.dataset.theme) syncToggle();
      });
    }
  </script>
</body>
</html>
