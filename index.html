<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="description" content="A simple home for Girt">
  <title>GirtHub</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111111;
      --panel: #1b1b1b;
      --panel-hover: #292929;
      --line: rgba(255,255,255,.09);
      --muted: #a1a1aa;
      --text: #f2f3f5;
      --accent: #FFA500;
      --accent-hover: #e69500;
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% -18%, rgba(255,165,0,.18), transparent 54%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell { width: min(100%, 760px); }
    .topbar {
      display: flex;
      align-items: center;
      margin-bottom: 22px;
      color: #fff;
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: -.035em;
    }
    .brand-hub { color: var(--accent); }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(27,27,27,.94);
      box-shadow: 0 24px 80px rgba(0,0,0,.4);
      backdrop-filter: blur(12px);
    }
    .intro { padding: clamp(28px, 7vw, 58px); }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      color: var(--accent);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
      box-shadow: 0 0 14px rgba(255,165,0,.75);
    }
    h1 {
      max-width: 600px;
      margin: 0;
      color: #fff;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      line-height: .99;
      letter-spacing: -.065em;
    }
    .description {
      max-width: 500px;
      margin: 20px 0 0;
      color: #b5bac1;
      font-size: clamp(1rem, 2.8vw, 1.12rem);
      line-height: 1.7;
    }
    .menu-heading {
      margin: 0 0 12px;
      color: #b5bac1;
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .menu { margin-top: 34px; }
    .menu-link {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 86px;
      padding: 16px 18px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 16px;
      color: #fff;
      background: #222;
      text-decoration: none;
      transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .menu-link:hover {
      transform: translateY(-2px);
      border-color: rgba(255,165,0,.7);
      background: var(--panel-hover);
      box-shadow: 0 12px 28px rgba(0,0,0,.25);
    }
    .menu-link:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .discord-icon {
      width: 50px;
      height: 50px;
      flex: 0 0 50px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: #171717;
      background: var(--accent);
    }
    .discord-icon svg { width: 29px; height: 24px; }
    .link-copy { min-width: 0; flex: 1; }
    .link-title { display: block; font-size: 1.05rem; font-weight: 800; }
    .link-detail { display: block; margin-top: 4px; color: #b5bac1; font-size: .84rem; }
    .arrow {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      color: var(--accent);
      transition: transform .18s ease, color .18s ease;
    }
    .menu-link:hover .arrow { transform: translateX(3px); color: #fff; }
    .footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 18px clamp(28px, 7vw, 58px);
      border-top: 1px solid var(--line);
      color: #858585;
      font-size: .78rem;
    }
    @media (max-width: 480px) {
      .footer { flex-direction: column; }
      .menu-link { gap: 12px; padding: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar" aria-label="GirtHub"><span>Girt</span><span class="brand-hub">&nbsp;Hub</span></div>

    <section class="panel" aria-labelledby="page-title">
      <div class="intro">
        <p class="eyebrow">Projects</p>
        <h1 id="page-title">A little hub<br>for the good stuff.</h1>
        <p class="description">Pick a destination and jump right in. Your shortcuts, all in one place.</p>

        <nav class="menu" aria-label="Website menu">
          <h2 class="menu-heading">Menu</h2>
          <a class="menu-link" href="https://girt26.github.io/thiscord">
            <span class="discord-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.7 5.1A18.2 18.2 0 0 0 15.2 3.7l-.6 1.2a16.8 16.8 0 0 0-5.2 0l-.6-1.2a18.2 18.2 0 0 0-4.5 1.4C1.5 9.3.7 13.4 1.1 17.4a18.4 18.4 0 0 0 5.5 2.8l1.2-1.9a11.8 11.8 0 0 1-1.9-.9l.5-.4c3.7 1.7 7.7 1.7 11.4 0l.5.4a11.8 11.8 0 0 1-1.9.9l1.2 1.9a18.4 18.4 0 0 0 5.5-2.8c.5-4.6-.8-8.7-3.4-12.3ZM8.8 14.8c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Zm6.4 0c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Z"/></svg>
            </span>
            <span class="link-copy">
              <span class="link-title">Thiscord</span>
              <span class="link-detail">Open Thiscord client</span>
            </span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </nav>
      </div>
      <footer class="footer">
        <span>One convenient place.</span>
        <span>© <span id="year"></span> Girt</span>
      </footer>
    </section>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
